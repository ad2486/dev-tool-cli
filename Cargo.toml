[package]
name = "devtool-rust-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dev"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
env_logger = "0.11.11"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"]}
thiserror = "2.0.20"
toml = "1.1.4"
